[build-system]
requires = ["meson-python","ninja","numpy","wheel"]
build-backend = "mesonpy"

[project]
name = "pyruqt"
version = "0.9.0"
description = "Python-based Rowan University Quantum Transport (pyRUQT)"
requires-python = ">=3.9"
license = {text = "LGPL-3.0"}
authors = [
    {name = "Erik P. Hoy", email = "hoy@rowan.edu"}
]
maintainers = [
    {name = "Hoy Research Group"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: Unix",
    "Programming Language :: Python :: 3",     
    "Programming Language :: Python :: 3.9",   
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics"
]
dependencies = [
    "numpy>=1.21.6",  
    "scipy>=1.8.1",  
    "matplotlib>=3.5.2",  
    "ase>=3.22.0"
]

[project.optional-dependencies]
pyscf = ["pyscf>=2.0.0"]

[project.urls]
Homepage = "https://github.com/HoyLab-Rowan/PyRUQT"

[tool.setuptools]
package-dir = {"" = "pyruqt"}

[tool.setuptools.packages.find]
where = ["pyruqt"]

[tool.setuptools.package-data]
"pyruqt" = ["*.so"]

